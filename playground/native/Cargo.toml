# The playground's engine (playground/wasm, CEr + webapi.js + view + EVG) in
# a native desktop window: SDL3 for the window, input and drawing, the
# display list painted here (src/paint.rs) with the system's TrueType faces
# (src/ttf.rs). build.mjs --native places this crate in the pinned Ranger
# tree as gallery/rangerdom_native, beside gallery/rangerdom_pg.
[package]
name = "rangerdom_native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"
# (staticlib: the engine built off the Mac and linked there with SDL3)
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "rangerdom-demo"
path = "src/main.rs"

[dependencies]
ranger = { path = "../../runtime/rust/ranger", features = ["shared-cell"] }
rangerevg = { path = "../../runtime/rust/rangerevg" }
rangerdom_pg = { path = "../rangerdom_pg" }
rangerdom_view = { path = "../domview" }

[patch."https://github.com/terotests/Ranger.git"]
ranger = { path = "../../runtime/rust/ranger", features = ["shared-cell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = true

[workspace]
